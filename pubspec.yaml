name: flutterappdev
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  path: ^1.9.1
  cloud_firestore: ^6.5.0
  share_plus: ^13.1.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  vector_math: ^2.2.0
  test_api: ^0.7.11
  matcher: ^0.12.19
  equatable: ^2.0.8
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

fonts:
  - family: Merriweather
    fonts:
      - asset: assets/fonts/Merriweather-96pt-Regular.ttf
      - asset: assets/fonts/Merriweather-120pt-Bold.ttf
        weight: 700
  - family: PlayfairDisplay
    fonts:
      - asset: assets/fonts/PlayfairDisplay-Regular.ttf
      - asset: assets/fonts/PlayFairDisplay-Italic.ttf
        style: italic
      - asset: assets/fonts/PlayfairDisplay-Bold.ttf
        weight: 700
